<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrintCaddy – Sign in with Google</title>
<script src="/gdrive-sync/printcad-config.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>body{font:17px -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;margin:0;background:#f6f7f9;color:#222;text-align:center;padding:0 20px}
button,a.b{font:inherit;padding:14px 26px;border-radius:12px;border:0;background:#1a6fd6;color:#fff;text-decoration:none;margin:8px}p{max-width:30em;color:#555}</style></head>
<body><img src="/assets/brand/app-icon-192.png" width="96" height="96" alt="">
<h2>Sign in to Google Drive for the PrintCaddy app</h2>
<button id="go">Sign in with Google</button><p id="msg">After signing in you'll be sent back to the PrintCaddy app.</p>
<script>
/* Google refuses sign-in inside an app's web view, so the iPad app opens this page in Safari;
   it gets a Drive token on the real site origin and hands it back to the app with printcaddy://auth. */
(function(){
  var q=new URLSearchParams(location.search), state=q.get('state')||'', scope=q.get('scope')||'https://www.googleapis.com/auth/drive.appdata', hint=q.get('hint')||'';
  var msg=document.getElementById('msg');
  function back(params){ var u='printcaddy://auth#'+new URLSearchParams(Object.assign({state:state},params)).toString();
    location.href=u; msg.innerHTML='Returning to PrintCaddy… <br><a class="b" href="'+u+'">Open PrintCaddy</a>'; }
  document.getElementById('go').onclick=function(){
    if(!(window.google&&google.accounts&&google.accounts.oauth2)){msg.textContent='Google sign-in is still loading – try again in a moment.';return;}
    google.accounts.oauth2.initTokenClient({client_id:(window.PRINTCAD_CONFIG||{}).googleClientId,scope:scope,
      callback:function(r){ if(r&&r.access_token) back({access_token:r.access_token,expires_in:String(r.expires_in||3600)}); else back({error:(r&&r.error)||'failed'}); },
      error_callback:function(e){ back({error:(e&&e.type)||'cancelled'}); }
    }).requestAccessToken(hint?{login_hint:hint,prompt:''}:{prompt:''});
  };
  if(q.get('cancel')) back({error:'cancelled'});
})();
</script></body></html>
